name: Transfer keystore to main repo (one-shot)

# 一次性运维 workflow —— 移动端并入 swarm-apps/SwarmDrop 单仓后，Android 签名
# keystore 需要迁到主仓，否则移动端无法再发版。
#
# 难点：旧 storepass 已遗失，且 GitHub secret 的值任何人都读不出来。
# 解法：让 keystore 与旧密码在 GitHub 内部见面 —— 本 workflow 用旧密码解开、
# 换成 NEW_KEYSTORE_PASS，再直接写入主仓的 secret。
#
# 刻意不产出 artifact：本仓是 public，artifact 任何人可下载，keystore 落在那里
# 始终是风险。全程只在 runner 内存/临时盘上过一遍，不出 GitHub。
#
# 跑完即删本文件、TRANSFER_TOKEN、NEW_KEYSTORE_PASS，并重新归档本仓。
on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Rotate storepass and write to main repo
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OLD_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEW_PASS: ${{ secrets.NEW_KEYSTORE_PASS }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GH_TOKEN: ${{ secrets.TRANSFER_TOKEN }}
          # 现网 v0.7.18 APK 的签名指纹（apksigner verify --print-certs 取得）。
          # 证书指纹是公开信息，不是 secret —— 存量用户装的就是这个签名。
          EXPECTED: fa19ff6e042c84e4f8ebb3c2b0f0a726cc917f61952074d94972981810eaea5f
        run: |
          set -euo pipefail
          umask 077
          echo "$KS_B64" | base64 -d > ks.p12

          # --- 1. 旧密码必须能打开，否则整件事的前提就是错的 ---
          keytool -list -keystore ks.p12 -storepass "$OLD_PASS" > /dev/null
          echo "✅ 旧密码可打开 keystore"

          # --- 2. 指纹必须等于现网 APK 的签名，否则换出来的 keystore 签的包
          #        存量用户装不上（INSTALL_FAILED_UPDATE_INCOMPATIBLE）---
          FP=$(keytool -list -v -keystore ks.p12 -storepass "$OLD_PASS" \
               | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-F' 'a-f')
          echo "  keystore 指纹 : $FP"
          echo "  现网 0.7.18   : $EXPECTED"
          if [ "$FP" != "$EXPECTED" ]; then
            echo "::error::指纹不匹配 —— 这不是签了现网 0.7.18 的 keystore，中止"
            exit 1
          fi
          echo "✅ 指纹匹配现网 APK"

          # --- 3. 换 storepass。PKCS12 的 keypass 与 storepass 绑定，
          #        -storepasswd 会一并改；-keypasswd 兜底，失败不致命 ---
          keytool -storepasswd -keystore ks.p12 -storepass "$OLD_PASS" -new "$NEW_PASS"
          keytool -keypasswd -keystore ks.p12 -alias "$ALIAS" \
            -storepass "$NEW_PASS" -keypass "$OLD_PASS" -new "$NEW_PASS" 2>/dev/null || true

          # --- 4. 新密码必须能打开，且指纹不能变（换密码不该动证书）---
          keytool -list -keystore ks.p12 -storepass "$NEW_PASS" > /dev/null
          FP2=$(keytool -list -v -keystore ks.p12 -storepass "$NEW_PASS" \
                | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-F' 'a-f')
          if [ "$FP2" != "$EXPECTED" ]; then
            echo "::error::换密码后指纹变了（$FP2），中止"
            exit 1
          fi
          echo "✅ 新密码可打开，且签名身份不变"

          # --- 5. 直接写主仓 secret，不经 artifact ---
          base64 -w0 ks.p12 | gh secret set ANDROID_KEYSTORE_BASE64 --repo swarm-apps/SwarmDrop
          printf '%s' "$NEW_PASS"  | gh secret set ANDROID_KEYSTORE_PASSWORD --repo swarm-apps/SwarmDrop
          printf '%s' "$ALIAS"     | gh secret set ANDROID_KEY_ALIAS         --repo swarm-apps/SwarmDrop
          echo "✅ 已写入 swarm-apps/SwarmDrop 的 3 个 secret"

          shred -u ks.p12 2>/dev/null || rm -f ks.p12
